<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>PC Kumanda</title>
</head>
<body>
<div class="wp" id="wp"></div>
<div class="fx" id="fx"></div>
<div class="wm" id="wm"><img id="wmimg" alt=""></div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="body">
    <header class="top">
      <div class="brand">PC<span>//</span>KUMANDA<i class="cursor"></i></div>
      <div class="chips" id="chips"></div>
      <button class="media" id="media" style="display:none"></button>
      <button class="score" id="score" style="display:none"></button>
      <button class="batt" id="batt" style="display:none" title="Pil zayıf"></button>
      <div class="clock" id="clock">--:--</div>
      <button class="ib" id="btnRefresh" title="Yenile"></button>
      <button class="ib" id="btnFull" title="Tam ekran"></button>
      <button class="ib" id="btnPower" title="Güç"></button>
    </header>
    <main class="main" id="main"><div class="boot">BAĞLANIYOR<i class="cursor"></i></div></main>
  </div>
</div>
<div class="match" id="match"></div>
<div class="mpanel" id="mpanel"></div>
<div class="pwpanel" id="pwpanel"></div>
<div class="off" id="off"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
